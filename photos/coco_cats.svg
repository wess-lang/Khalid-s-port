    <rect x="0" y="210" width="180" height="180" rx="10" fill="#F0E6D2" stroke="#241B12" stroke-width="2"/>
    <text x="90" y="290" font-family="sans-serif" font-size="36" text-anchor="middle">🕯️</text>
